name: Publish Package

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          standalone: true
          run_install: true
          cache: true

      - name: Test config
        run: pnpm run test

      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ $VERSION == *"-"* ]]; then
            echo "TAG=next" >> $GITHUB_OUTPUT
          else
            echo "TAG=latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish package
        # --tag determined by the type of git tag (pre-release vs stable)
        # --access public (only actually required for first deploy but why not)
        # --provenance is required to make pnpm actually include OIDC token
        # --no-git-checks since we're working on a checkout tag, and not the branch
        run: pnpm publish --tag ${{ steps.dist-tag.outputs.TAG }} --access public --provenance --no-git-checks
